[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-engine-from-scratch"
version = "0.1.0"
description = "A full-text search engine written from scratch in pure Python (inverted index, segments, BM25 and TF-IDF, phrase/boolean/NEAR/prefix/fuzzy queries), checked against SQLite FTS5"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SafraNako" }]
keywords = ["search", "search-engine", "inverted-index", "tf-idf", "bm25", "full-text-search", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SafraNako/search-engine-from-scratch"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "scikit-learn>=1.3",
]

[project.scripts]
arama = "kendi_arama.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
